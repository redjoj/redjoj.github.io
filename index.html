<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph Wang – Hardware Design Portfolio</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #09090C;
            --surface: #1a1d27;
            --surface-hover: #222633;
            --border: #2a2e3d;
            --text: #e2e4ea;
            --text-muted: #8b90a0;
            --accent: #4dabf7;
            --accent-dim: rgba(77, 171, 247, 0.08);
            --green: #51cf66;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            padding: 4rem 1.5rem 3rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 520px;
            margin: 0 auto;
        }

        .hero .links {
            margin-top: 1.25rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hero .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .hero .links a:hover { color: var(--accent); }

        .hero .links a svg {
            width: 16px;
            height: 16px;
            vertical-align: -2px;
            margin-right: 4px;
            fill: currentColor;
        }

        .grid {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
            white-space: nowrap;
        }

        .tag.fpga { color: var(--green); background: rgba(81, 207, 102, 0.08); }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex: 1;
        }

        .card .view {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card .view svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .card:hover .view svg { transform: translateX(3px); }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover { color: var(--accent); }

        footer details {
            margin-top: 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        footer summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        footer summary:hover { color: var(--text); }

        .disclaimer {
            margin-top: 0.75rem;
            text-align: left;
            font-size: 0.75rem;
            line-height: 1.5;
            color: #6b7080;
        }

        .disclaimer p { margin-bottom: 0.5rem; }
        .disclaimer p:last-child { margin-bottom: 0; }

        @media (max-width: 600px) {
            .hero { padding: 3rem 1.25rem 2rem; }
            .hero h1 { font-size: 1.6rem; }
            .grid { grid-template-columns: 1fr; padding: 0 1.25rem 3rem; }
        }
    </style>
</head>
